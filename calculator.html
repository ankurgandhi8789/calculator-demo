<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #1a1a2e;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  .calculator {
    width: 320px;
    background: #16213e;
    border-radius: 20px;
    padding: 24px;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.5),
      0 0 0 1px rgba(255, 255, 255, 0.05);
  }

  /* --- Display --- */
  .display {
    background: #0f3460;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    text-align: right;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    word-break: break-all;
    overflow: hidden;
  }

  .display .expression {
    color: #8a8a9a;
    font-size: 14px;
    min-height: 20px;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }

  .display .result {
    color: #e4e4e4;
    font-size: 32px;
    font-weight: 600;
    line-height: 1.2;
    transition: color 0.15s;
  }

  .display .result.small {
    font-size: 22px;
  }

  /* --- Button Grid --- */
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    padding: 16px;
    font-size: 18px;
    font-weight: 500;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
    outline: none;
    letter-spacing: 0.3px;
  }

  button:active {
    transform: scale(0.95);
  }

  /* Number buttons */
  .btn-num {
    background: #1a1a3e;
    color: #e4e4e4;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
  .btn-num:hover {
    background: #252550;
  }

  /* Operator buttons */
  .btn-op {
    background: #e94560;
    color: #fff;
    box-shadow: 0 4px 12px rgba(233, 69, 96, 0.3);
  }
  .btn-op:hover {
    background: #f05575;
  }

  /* Function buttons (AC, DEL, %) */
  .btn-fn {
    background: #0f3460;
    color: #7b8cba;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
  .btn-fn:hover {
    background: #154080;
    color: #a0b0d0;
  }

  /* Equals button */
  .btn-eq {
    background: #0ea5e9;
    color: #fff;
    box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
    grid-column: span 2;
  }
  .btn-eq:hover {
    background: #14b8e8;
  }

  /* Zero button spans 2 columns */
  .btn-zero {
    grid-column: span 2;
  }

  /* --- Responsive --- */
  @media (max-width: 360px) {
    .calculator {
      width: 95vw;
    }
    button {
      padding: 14px;
      font-size: 16px;
    }
  }
</style>
</head>
<body>

<div class="calculator">
  <!-- Display -->
  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>

  <!-- Buttons -->
  <div class="buttons">
    <button class="btn-fn" data-action="clear">AC</button>
    <button class="btn-fn" data-action="delete">DEL</button>
    <button class="btn-op"  data-action="operator" data-value="%">%</button>
    <button class="btn-op"  data-action="operator" data-value="÷">÷</button>

    <button class="btn-num" data-action="number" data-value="7">7</button>
    <button class="btn-num" data-action="number" data-value="8">8</button>
    <button class="btn-num" data-action="number" data-value="9">9</button>
    <button class="btn-op"  data-action="operator" data-value="×">×</button>

    <button class="btn-num" data-action="number" data-value="4">4</button>
    <button class="btn-num" data-action="number" data-value="5">5</button>
    <button class="btn-num" data-action="number" data-value="6">6</button>
    <button class="btn-op"  data-action="operator" data-value="-">−</button>

    <button class="btn-num" data-action="number" data-value="1">1</button>
    <button class="btn-num" data-action="number" data-value="2">2</button>
    <button class="btn-num" data-action="number" data-value="3">3</button>
    <button class="btn-op"  data-action="operator" data-value="+">+</button>

    <button class="btn-num btn-zero" data-action="number" data-value="0">0</button>
    <button class="btn-num"        data-action="number" data-value=".">.</button>
    <button class="btn-eq"        data-action="equals">=</button>
  </div>
</div>

<script>
  // --- State ---
  let currentInput  = '0';   // displayed number being typed
  let previousInput = '';    // stored operand
  let operator      = null;  // '+', '-', '×', '÷', '%'
  let expressionStr = '';    // shown in the expression bar

  const resultEl     = document.getElementById('result');
  const expressionEl = document.getElementById('expression');

  // --- Helpers ---
  function updateDisplay(value) {
    resultEl.textContent = value;
    // shrink font if too long
    resultEl.classList.toggle('small', value.length > 10);
  }

  function updateExpression(str) {
    expressionEl.textContent = str;
  }

  // --- Core Logic ---
  function inputNumber(num) {
    if (num === '.' && currentInput.includes('.')) return;
    if (currentInput === '0' && num !== '.') {
      currentInput = num;
    } else {
      currentInput += num;
    }
    updateDisplay(currentInput);
  }

  function inputOperator(op) {
    // If there's already a pending operation, compute it first ("chain")
    if (operator && previousInput !== '') {
      compute();
    }
    previousInput = currentInput;
    operator = op;
    // Build expression string for display
    const opMap = { '+': '+', '-': '−', '×': '×', '÷': '÷', '%': '%' };
    expressionStr = formatNumber(previousInput) + ' ' + (opMap[op] || op);
    updateExpression(expressionStr);
    currentInput = '0';
    updateDisplay('0');
  }

  function compute() {
    if (!operator || previousInput === '') return;

    const a = parseFloat(previousInput);
    const b = parseFloat(currentInput);
    let result;

    switch (operator) {
      case '+': result = a + b; break;
      case '-': result = a - b; break;
      case '×': result = a * b; break;
      case '÷':
        if (b === 0) {
          updateDisplay('Error');
          updateExpression('Cannot divide by 0');
          resetState();
          return;
        }
        result = a / b;
        break;
      case '%': result = a % b; break;
      default: return;
    }

    // Round to avoid floating-point noise (e.g. 0.1+0.2)
    result = parseFloat(result.toPrecision(12));

    const opMap = { '+': '+', '-': '−', '×': '×', '÷': '÷', '%': '%' };
    expressionStr = formatNumber(previousInput) + ' ' + (opMap[operator] || operator)
                  + ' ' + formatNumber(currentInput) + ' =';
    updateExpression(expressionStr);
    currentInput = String(result);
    previousInput = '';
    operator = null;
    updateDisplay(currentInput);
  }

  function formatNumber(num) {
    // Show nicely: 1234.5 → "1,234.5", but keep decimals short
    if (Number.isInteger(num) && Math.abs(num) < 1e15) {
      return num.toLocaleString('en-US');
    }
    return String(num);
  }

  function clearAll() {
    resetState();
    updateDisplay('0');
    updateExpression('');
  }

  function deleteLast() {
    if (currentInput.length <= 1 || (currentInput.length === 2 && currentInput.startsWith('-'))) {
      currentInput = '0';
    } else {
      currentInput = currentInput.slice(0, -1);
    }
    updateDisplay(currentInput);
  }

  function resetState() {
    currentInput  = '0';
    previousInput = '';
    operator      = null;
    expressionStr = '';
  }

  // --- Keyboard Support ---
  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') inputNumber(e.key);
    else if (e.key === '.')            inputNumber('.');
    else if (e.key === '+')           inputOperator('+');
    else if (e.key === '-')           inputOperator('-');
    else if (e.key === '*')           inputOperator('×');
    else if (e.key === '/')          { e.preventDefault(); inputOperator('÷'); }
    else if (e.key === '%')          inputOperator('%');
    else if (e.key === 'Enter' || e.key === '=') compute();
    else if (e.key === 'Backspace')  deleteLast();
    else if (e.key === 'Escape')     clearAll();
  });

  // --- Button Click Handler ---
  document.querySelector('.buttons').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;

    const action = btn.dataset.action;
    const value  = btn.dataset.value;

    switch (action) {
      case 'number':  inputNumber(value);   break;
      case 'operator': inputOperator(value); break;
      case 'equals':   compute();            break;
      case 'clear':    clearAll();           break;
      case 'delete':   deleteLast();         break;
    }
  });
</script>

</body>
</html>
